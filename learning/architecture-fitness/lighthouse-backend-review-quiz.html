<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Lighthouse 실제 사례로 용어, 코드 판독, 구현 비교와 시니어 백엔드 의사결정을 훈련하는 인터랙티브 워크북"
    />
    <title>Lighthouse Backend Review Lab</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #102a43;
        --ink-soft: #486581;
        --paper: #f4f7fb;
        --surface: #ffffff;
        --navy: #102a43;
        --navy-2: #173f5f;
        --line: #bcccdc;
        --line-strong: #829ab1;
        --cyan: #00a8cc;
        --cyan-soft: #d9f3f8;
        --amber: #f0a202;
        --amber-soft: #fff3ce;
        --green: #16865c;
        --green-soft: #dcf4e9;
        --red: #c2413b;
        --red-soft: #fee8e7;
        --shadow: 0 18px 42px rgba(16, 42, 67, 0.1);
        --radius: 14px;
        --display:
          "Arial Narrow", "Aptos Narrow", "Apple SD Gothic Neo", sans-serif;
        --body: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--paper);
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          linear-gradient(rgba(16, 42, 67, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(16, 42, 67, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 24px 24px;
        font-family: var(--body);
        line-height: 1.62;
      }

      button,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--amber);
        outline-offset: 3px;
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 292px minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        padding: 28px 22px 24px;
        color: #f0f6fa;
        background: var(--navy);
        border-right: 5px solid var(--cyan);
      }

      .brand {
        margin-bottom: 28px;
      }

      .brand-kicker,
      .eyebrow,
      .module-label,
      .utility-label {
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      .brand-kicker {
        color: #72d7e8;
      }

      .brand h1 {
        margin: 7px 0 8px;
        max-width: 230px;
        font-family: var(--display);
        font-size: clamp(2rem, 3vw, 2.8rem);
        font-stretch: condensed;
        line-height: 0.96;
        letter-spacing: -0.035em;
        text-transform: uppercase;
      }

      .brand p {
        margin: 0;
        color: #bcccdc;
        font-size: 0.88rem;
      }

      .progress-block {
        padding: 16px;
        margin-bottom: 24px;
        background: rgba(255, 255, 255, 0.065);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 10px;
      }

      .progress-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 9px;
      }

      .progress-number {
        font-family: var(--mono);
        font-size: 1.35rem;
        font-weight: 800;
        color: white;
      }

      .progress-caption {
        color: #9fb3c8;
        font-size: 0.76rem;
      }

      .progress-track {
        height: 7px;
        overflow: hidden;
        background: #334e68;
        border-radius: 999px;
      }

      .progress-fill {
        width: 0;
        height: 100%;
        background: var(--cyan);
        transition: width 220ms ease;
      }

      .progress-counts {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        color: #bcccdc;
        font-size: 0.76rem;
      }

      .module-nav {
        display: grid;
        gap: 7px;
      }

      .module-button {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        align-items: center;
        gap: 9px;
        width: 100%;
        padding: 10px 9px;
        color: #d9e2ec;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 8px;
      }

      .module-button:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      .module-button.active {
        color: white;
        background: var(--navy-2);
        border-color: rgba(114, 215, 232, 0.4);
      }

      .module-index {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        color: #072331;
        background: #72d7e8;
        border-radius: 50%;
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 800;
      }

      .module-title {
        font-size: 0.86rem;
        font-weight: 700;
      }

      .module-count {
        color: #9fb3c8;
        font-family: var(--mono);
        font-size: 0.7rem;
      }

      .sidebar-actions {
        display: flex;
        gap: 8px;
        margin-top: 24px;
      }

      .ghost-button {
        padding: 8px 10px;
        color: #d9e2ec;
        background: transparent;
        border: 1px solid #486581;
        border-radius: 7px;
        font-size: 0.76rem;
      }

      .main {
        min-width: 0;
        padding: 28px clamp(22px, 5vw, 72px) 48px;
      }

      .topbar {
        max-width: 980px;
        margin: 0 auto 22px;
      }

      .pipeline {
        position: relative;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        padding: 0;
        margin: 0 0 22px;
        list-style: none;
      }

      .pipeline::before {
        position: absolute;
        top: 13px;
        right: 8%;
        left: 8%;
        height: 2px;
        content: "";
        background: repeating-linear-gradient(
          90deg,
          var(--line-strong) 0,
          var(--line-strong) 8px,
          transparent 8px,
          transparent 14px
        );
      }

      .pipeline li {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 5px;
        color: var(--ink-soft);
        font-family: var(--mono);
        font-size: 0.67rem;
        font-weight: 700;
      }

      .pipeline-dot {
        width: 27px;
        height: 27px;
        background: var(--surface);
        border: 2px solid var(--line-strong);
        border-radius: 50%;
      }

      .pipeline li.active .pipeline-dot {
        background: var(--cyan);
        border-color: var(--navy);
        box-shadow: 0 0 0 5px var(--cyan-soft);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .toolbar-copy {
        color: var(--ink-soft);
        font-size: 0.87rem;
      }

      .toolbar-controls {
        display: flex;
        gap: 8px;
      }

      .toolbar select,
      .toolbar button {
        padding: 9px 11px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 0.8rem;
      }

      .question-shell {
        max-width: 980px;
        margin: 0 auto;
      }

      .question-card {
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--line);
        border-top: 7px solid var(--cyan);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .question-head {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) auto;
        gap: 20px;
        align-items: start;
        padding: clamp(22px, 4vw, 38px);
        padding-bottom: 22px;
        border-bottom: 1px solid #d9e2ec;
      }

      .question-number {
        font-family: var(--display);
        font-size: 2.7rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .question-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-bottom: 8px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 3px 8px;
        color: var(--ink-soft);
        background: #edf2f7;
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 0.67rem;
        font-weight: 700;
      }

      .chip.status-mastered {
        color: #0c5a3d;
        background: var(--green-soft);
      }

      .chip.status-revisit {
        color: #8b2f2a;
        background: var(--red-soft);
      }

      .question-title {
        margin: 0;
        font-family: var(--display);
        font-size: clamp(1.7rem, 3vw, 2.45rem);
        line-height: 1.08;
        letter-spacing: -0.025em;
      }

      .question-body {
        padding: clamp(24px, 4vw, 38px);
      }

      .prompt {
        max-width: 760px;
        color: #243b53;
        font-size: 1.02rem;
      }

      .prompt p:first-child {
        margin-top: 0;
      }

      .prompt code,
      .model-answer code {
        padding: 0.1em 0.34em;
        background: #e9f1f7;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 0.9em;
      }

      pre {
        overflow-x: auto;
        padding: 18px;
        color: #e6fffa;
        background: #102a43;
        border-left: 5px solid var(--cyan);
        border-radius: 8px;
        font-family: var(--mono);
        font-size: 0.84rem;
        line-height: 1.6;
        white-space: pre;
      }

      .choice-list {
        display: grid;
        gap: 9px;
        margin: 22px 0;
      }

      .choice {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 10px;
        align-items: start;
        padding: 12px 14px;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .choice:has(input:checked) {
        background: var(--cyan-soft);
        border-color: var(--cyan);
      }

      .answer-label {
        display: block;
        margin: 24px 0 8px;
        color: var(--ink-soft);
        font-family: var(--mono);
        font-size: 0.73rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      textarea {
        width: 100%;
        min-height: 170px;
        padding: 16px;
        resize: vertical;
        color: var(--ink);
        background: #fbfdff;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        line-height: 1.6;
      }

      .question-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 18px;
      }

      .action {
        padding: 10px 14px;
        border: 1px solid transparent;
        border-radius: 8px;
        font-weight: 750;
      }

      .action-primary {
        color: white;
        background: var(--navy);
      }

      .action-secondary {
        color: var(--ink);
        background: white;
        border-color: var(--line-strong);
      }

      .action-hint {
        color: #805b00;
        background: var(--amber-soft);
        border-color: #e8bf55;
      }

      .hint,
      .model-answer,
      .self-check {
        display: none;
        padding: 16px 18px;
        margin-top: 16px;
        border-radius: 8px;
      }

      .hint.visible,
      .model-answer.visible,
      .self-check.visible {
        display: block;
      }

      .hint {
        color: #604600;
        background: var(--amber-soft);
        border-left: 5px solid var(--amber);
      }

      .model-answer {
        color: #143d2c;
        background: var(--green-soft);
        border-left: 5px solid var(--green);
      }

      .model-answer h3 {
        margin-top: 0;
        font-size: 1rem;
      }

      .self-check {
        background: #edf2f7;
      }

      .self-check strong {
        display: block;
        margin-bottom: 10px;
      }

      .review-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      .review-mastered {
        color: white;
        background: var(--green);
      }

      .review-revisit {
        color: white;
        background: var(--red);
      }

      .navigation {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 16px;
      }

      .nav-button {
        min-width: 120px;
        padding: 11px 16px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        font-weight: 750;
      }

      .nav-button.next {
        color: white;
        background: var(--navy);
      }

      .empty {
        padding: 64px 24px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .empty h2 {
        font-family: var(--display);
        font-size: 2rem;
      }

      .footer-note {
        max-width: 980px;
        margin: 28px auto 0;
        color: var(--ink-soft);
        font-size: 0.78rem;
      }

      .footer-note a {
        color: var(--navy-2);
      }

      @media (max-width: 820px) {
        .app {
          display: block;
        }

        .sidebar {
          position: relative;
          width: auto;
          height: auto;
          border-right: 0;
          border-bottom: 5px solid var(--cyan);
        }

        .brand h1 {
          max-width: none;
        }

        .module-nav {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .main {
          padding: 22px 14px 40px;
        }

        .question-head {
          grid-template-columns: 54px minmax(0, 1fr);
        }

        .question-head > :last-child {
          grid-column: 2;
        }
      }

      @media (max-width: 520px) {
        .module-nav {
          grid-template-columns: 1fr;
        }

        .pipeline li span:last-child {
          font-size: 0.58rem;
        }

        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .toolbar-controls {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        .question-head {
          grid-template-columns: 1fr;
          gap: 10px;
        }

        .question-head > :last-child {
          grid-column: auto;
        }

        .question-number {
          font-size: 2rem;
        }

        .navigation .nav-button {
          min-width: 0;
          flex: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }

      @media print {
        .sidebar,
        .topbar,
        .question-actions,
        .navigation {
          display: none !important;
        }

        .app {
          display: block;
        }

        .main {
          padding: 0;
        }

        .question-card {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="학습 모듈">
        <div class="brand">
          <div class="brand-kicker">Lighthouse / Backend Lab</div>
          <h1>Request Boundary Workbook</h1>
          <p>용어를 코드와 결정으로 연결하는 46개 실전 문제</p>
        </div>

        <section class="progress-block" aria-labelledby="progress-title">
          <div class="progress-meta">
            <span id="progress-title" class="utility-label">학습 진도</span>
            <span id="progress-number" class="progress-number">0%</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <div class="progress-counts">
            <span id="mastered-count">이해 0</span>
            <span id="revisit-count">복습 0</span>
          </div>
        </section>

        <nav id="module-nav" class="module-nav" aria-label="단계 선택"></nav>

        <div class="sidebar-actions">
          <button id="next-open-button" class="ghost-button" type="button">
            다음 미완료
          </button>
          <button id="reset-button" class="ghost-button" type="button">
            진도 초기화
          </button>
        </div>
      </aside>

      <main class="main">
        <div class="topbar">
          <ol class="pipeline" aria-label="백엔드 요청 처리 흐름">
            <li data-pipeline="1">
              <span class="pipeline-dot"></span><span>입구</span>
            </li>
            <li data-pipeline="2">
              <span class="pipeline-dot"></span><span>검증</span>
            </li>
            <li data-pipeline="3">
              <span class="pipeline-dot"></span><span>실행</span>
            </li>
            <li data-pipeline="4">
              <span class="pipeline-dot"></span><span>저장</span>
            </li>
            <li data-pipeline="5">
              <span class="pipeline-dot"></span><span>운영</span>
            </li>
          </ol>

          <div class="toolbar">
            <div id="toolbar-copy" class="toolbar-copy">
              한 번에 한 문제만 판단한다.
            </div>
            <div class="toolbar-controls">
              <select id="status-filter" aria-label="문항 상태 필터">
                <option value="all">전체 문항</option>
                <option value="open">미완료만</option>
                <option value="revisit">복습만</option>
                <option value="mastered">이해한 문항</option>
              </select>
              <button id="print-button" type="button">현재 문제 인쇄</button>
            </div>
          </div>
        </div>

        <div
          id="question-shell"
          class="question-shell"
          aria-live="polite"
        ></div>

        <p class="footer-note">
          답안은 이 브라우저에만 저장된다. 개념의 설명 순서는
          <a href="./lighthouse-backend-review-guide">백엔드 리뷰 가이드</a
          >에서 확인하고, 텍스트 참고본은
          <a href="./lighthouse-backend-review-quiz-reference">Markdown 퀴즈</a
          >에서
          확인한다.
        </p>
      </main>
    </div>

    <script>
      "use strict";

      const modules = [
        { id: 1, title: "용어와 입구", range: "1–6", pipeline: 1 },
        { id: 2, title: "동시성과 권한", range: "7–12", pipeline: 4 },
        { id: 3, title: "코드 판독", range: "13–21", pipeline: 2 },
        { id: 4, title: "구현 비교", range: "22–27", pipeline: 3 },
        { id: 5, title: "시니어 결정", range: "28–35", pipeline: 5 },
        { id: 6, title: "DB와 오류 계약", range: "36–40", pipeline: 4 },
        { id: 7, title: "저장 경계", range: "41–46", pipeline: 4 },
      ];

      const q = (
        id,
        module,
        type,
        title,
        prompt,
        hint,
        model,
        axes,
        choices = [],
      ) => ({
        id,
        module,
        type,
        title,
        prompt,
        hint,
        model,
        axes,
        choices,
      });

      const questions = [
        q(
          1,
          1,
          "용어",
          "Zod와 bounded body",
          `<p>다음 두 장치의 책임을 각각 설명하라. 둘 중 하나만 사용했을 때 남는 위험도 적어라.</p>
<pre>await readBoundedJsonBody(req, { maxBytes: 1_000_000 });
schema.safeParse(body);</pre>`,
          "크기와 내용은 서로 다른 질문이다. 어느 장치가 JSON parse보다 먼저 작동하는지 보라.",
          "<p><strong>Bounded body</strong>는 읽을 byte를 제한하고 초과 시 413으로 거부한다. <strong>Zod</strong>는 허용된 크기의 JSON 안에서 필드 형식과 값을 검사한다. Zod만 쓰면 큰 요청의 메모리·parse 비용을 이미 사용한다. 크기 제한만 쓰면 작지만 잘못된 값을 통과시킨다.</p>",
          ["용어", "제품 보장"],
        ),
        q(
          2,
          1,
          "상태 코드",
          "호출자가 다음에 할 행동",
          "<p>본문 크기 제한을 넘은 요청에는 어떤 상태가 가장 적절한가?</p>",
          "400은 값이 잘못됐다는 뜻이다. 크기 초과는 별도 상태가 있다.",
          "<p><strong>413 Payload Too Large</strong>다. 호출자는 인증을 갱신하거나 잠시 기다리는 것이 아니라 입력 크기를 줄여야 한다.</p>",
          ["용어"],
          ["400", "401", "413", "429"],
        ),
        q(
          3,
          1,
          "권한",
          "인증과 권한은 다르다",
          "<p>Lighthouse reaction에서 인증과 권한 확인의 차이를 설명하라. 현재 API가 사용자 A에게 사용자 B의 principal을 직접 지정하게 하는지도 답하라.</p>",

<a href="https://github.com/corca-ai/lighthouse/blob/main/docs/runtime-flows/gap-network-analysis.md">Gap network runtime flow</a></p>`,
          "Transaction 범위를 코드 편의가 아니라 사용자에게 함께 보장할 결과로 정하라.",
          "<p>하나의 긴 transaction으로 묶지 않는다. LLM을 기다리는 동안 DB 연결과 잠금을 오래 점유하고, enrichment 실패가 이미 유효한 core까지 rollback하기 때문이다. 현재처럼 pending, core, enrichment terminal을 짧은 write로 나누고 version 조건으로 오래된 Runner를 거부한다. 다만 core만으로 사용자 가치를 제공할 수 있는지는 제품 정책이 먼저 결정한다.</p>",
          ["제품 보장", "의사결정"],
        ),
        q(
          46,
          7,
          "거시 구조",
          "Lighthouse는 DB 중심 서비스인가",
          `<p>다음 설명을 검토하라.</p>
<pre>Lighthouse는 검색 서비스이므로 모든 논문 검색과 결과를
자체 DB에서 처리하고 저장한다.</pre>
<p>실제 검색 경로와 DB가 맡는 상태를 나누고, DB 학습 사례로 Gap report를 깊게 본 이유를 설명하라.</p>
<p class="source-note">실제 근거:
<a href="https://github.com/corca-ai/lighthouse/blob/main/docs/runtime-flows/search-mechanism.md">Search runtime flow</a>,
<a href="https://github.com/corca-ai/lighthouse/blob/main/docs/runtime-flows/gap-network-analysis.md">Gap runtime flow</a></p>`,
          "검색 corpus의 owner와 재방문·복구해야 하는 상태의 owner를 분리하라.",
          "<p>설명은 틀렸다. Query 검색과 논문 corpus는 Episteme provider가 담당한다. Lighthouse DB는 reviewed papers, Gap artifact와 reaction, inline-analysis cache, LLM usage와 운영 기록처럼 지속되어야 하는 상태를 맡는다. Gap report는 평균 route라서가 아니라 identity, 동시성, lease, CAS, 중단 복구와 partial failure가 가장 밀집돼 있어 DB 리뷰를 학습하기 좋은 사례다.</p>",
          ["제품 보장", "의사결정"],
          ["설명이 맞다", "설명이 틀리다"],
        ),
      ];

      const STORAGE_KEY = "lighthouse-backend-review-lab-v1";
      const defaultState = {
        currentId: 1,
        selectedModule: 1,
        filter: "all",
        answers: {},
        reviews: {},
        revealed: {},
        hints: {},
      };

      function loadState() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          return { ...defaultState, ...parsed };
        } catch {
          return { ...defaultState };
        }
      }

      let state = loadState();

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch {
          // Local file privacy settings may block storage. The session still works.
        }
      }

      function filteredQuestions() {
        return questions.filter((question) => {
          if (question.module !== state.selectedModule) return false;
          const review = state.reviews[question.id];
          if (state.filter === "open") return !review;
          if (state.filter === "mastered") return review === "mastered";
          if (state.filter === "revisit") return review === "revisit";
          return true;
        });
      }

      function reviewLabel(questionId) {
        const review = state.reviews[questionId];
        if (review === "mastered") return ["이해", "status-mastered"];
        if (review === "revisit") return ["복습", "status-revisit"];
        if (state.answers[questionId]) return ["작성 중", ""];
        return ["미완료", ""];
      }

      function setCurrent(questionId) {
        const question = questions.find((item) => item.id === questionId);
        if (!question) return;
        state.currentId = question.id;
        state.selectedModule = question.module;
        saveState();
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function renderModules() {
        const nav = document.getElementById("module-nav");
        nav.innerHTML = modules
          .map((module) => {
            const items = questions.filter(
              (question) => question.module === module.id,
            );
            const complete = items.filter(
              (question) => state.reviews[question.id] === "mastered",
            ).length;
            return `<button class="module-button ${state.selectedModule === module.id ? "active" : ""}"
              type="button" data-module-id="${module.id}" aria-pressed="${state.selectedModule === module.id}">
              <span class="module-index">${module.id}</span>
              <span class="module-title">${module.title}</span>
              <span class="module-count">${complete}/${items.length}</span>
            </button>`;
          })
          .join("");

        nav.querySelectorAll("[data-module-id]").forEach((button) => {
          button.addEventListener("click", () => {
            state.selectedModule = Number(button.dataset.moduleId);
            const candidates = filteredQuestions();
            state.currentId =
              candidates.find((question) => !state.reviews[question.id])?.id ??
              candidates[0]?.id ??
              questions.find(
                (question) => question.module === state.selectedModule,
              )?.id;
            saveState();
            render();
          });
        });
      }

      function renderProgress() {
        const mastered = questions.filter(
          (question) => state.reviews[question.id] === "mastered",
        ).length;
        const revisit = questions.filter(
          (question) => state.reviews[question.id] === "revisit",
        ).length;
        const percent = Math.round((mastered / questions.length) * 100);

        document.getElementById("progress-number").textContent = `${percent}%`;
        document.getElementById("progress-fill").style.width = `${percent}%`;
        document.getElementById("mastered-count").textContent =
          `이해 ${mastered}`;
        document.getElementById("revisit-count").textContent =
          `복습 ${revisit}`;
      }

      function renderPipeline(moduleId) {
        const active =
          modules.find((module) => module.id === moduleId)?.pipeline ?? 1;
        document.querySelectorAll("[data-pipeline]").forEach((item) => {
          item.classList.toggle(
            "active",
            Number(item.dataset.pipeline) === active,
          );
        });
      }

      function renderQuestion() {
        const shell = document.getElementById("question-shell");
        const candidates = filteredQuestions();
        let question = candidates.find((item) => item.id === state.currentId);
        if (!question) {
          question = candidates[0];
          if (question) state.currentId = question.id;
        }

        if (!question) {
          shell.innerHTML = `<section class="empty">
            <h2>이 조건의 문항이 없다</h2>
            <p>다른 상태 필터나 모듈을 선택하라.</p>
          </section>`;
          return;
        }

        renderPipeline(question.module);
        const module = modules.find((item) => item.id === question.module);
        const [statusText, statusClass] = reviewLabel(question.id);
        const candidateIndex = candidates.findIndex(
          (item) => item.id === question.id,
        );
        const answer = state.answers[question.id] ?? "";
        const isRevealed = Boolean(state.revealed[question.id]);
        const isHintVisible = Boolean(state.hints[question.id]);

        const choices = question.choices.length
          ? `<div class="choice-list">${question.choices
              .map(
                (choice, index) => `<label class="choice">
                  <input type="radio" name="choice" value="${index}" ${
                    answer === `choice:${index}` ? "checked" : ""
                  } />
                  <span>${choice}</span>
                </label>`,
              )
              .join("")}</div>`
          : `<label class="answer-label" for="answer-input">내 판단</label>
             <textarea id="answer-input" placeholder="관찰한 사실 → 깨질 수 있는 보장 → 대응 → 검증 순서로 적어보라."></textarea>`;

        shell.innerHTML = `
          <article class="question-card">
            <header class="question-head">
              <div class="question-number">${String(question.id).padStart(2, "0")}</div>
              <div>
                <div class="question-meta">
                  <span class="chip">${module.title}</span>
                  <span class="chip">${question.type}</span>
                  ${question.axes.map((axis) => `<span class="chip">${axis}</span>`).join("")}
                </div>
                <h2 class="question-title">${question.title}</h2>
              </div>
              <span class="chip ${statusClass}">${statusText}</span>
            </header>
            <div class="question-body">
              <div class="prompt">${question.prompt}</div>
              ${choices}
              <div class="question-actions">
                <button id="hint-button" class="action action-hint" type="button">힌트</button>
                <button id="answer-button" class="action action-primary" type="button">모범 판단 보기</button>
              </div>
              <div id="hint-panel" class="hint ${isHintVisible ? "visible" : ""}">
                <strong>힌트</strong><br />${question.hint}
              </div>
              <div id="model-panel" class="model-answer ${isRevealed ? "visible" : ""}">
                <h3>모범 판단</h3>
                ${question.model}
              </div>
              <div id="self-check" class="self-check ${isRevealed ? "visible" : ""}">
                <strong>지금 내 설명 수준을 기록한다.</strong>
                <div class="review-buttons">
                  <button class="action review-mastered" data-review="mastered" type="button">이해했다</button>
                  <button class="action review-revisit" data-review="revisit" type="button">다시 볼 것</button>
                </div>
              </div>
            </div>
          </article>
          <nav class="navigation" aria-label="문항 이동">
            <button id="previous-button" class="nav-button" type="button" ${
              candidateIndex <= 0 ? "disabled" : ""
            }>← 이전</button>
            <button id="next-button" class="nav-button next" type="button" ${
              candidateIndex >= candidates.length - 1 ? "disabled" : ""
            }>다음 →</button>
          </nav>`;

        const textarea = document.getElementById("answer-input");
        if (textarea) {
          textarea.value = answer;
          textarea.addEventListener("input", (event) => {
            state.answers[question.id] = event.target.value;
            saveState();
          });
        }

        shell.querySelectorAll('input[name="choice"]').forEach((input) => {
          input.addEventListener("change", () => {
            state.answers[question.id] = `choice:${input.value}`;
            saveState();
          });
        });

        document.getElementById("hint-button").addEventListener("click", () => {
          state.hints[question.id] = !state.hints[question.id];
          saveState();
          document.getElementById("hint-panel").classList.toggle("visible");
        });

        document
          .getElementById("answer-button")
          .addEventListener("click", () => {
            state.revealed[question.id] = true;
            saveState();
            document.getElementById("model-panel").classList.add("visible");
            document.getElementById("self-check").classList.add("visible");
          });

        shell.querySelectorAll("[data-review]").forEach((button) => {
          button.addEventListener("click", () => {
            state.reviews[question.id] = button.dataset.review;
            saveState();
            render();
          });
        });

        document
          .getElementById("previous-button")
          .addEventListener("click", () => {
            if (candidateIndex > 0)
              setCurrent(candidates[candidateIndex - 1].id);
          });

        document.getElementById("next-button").addEventListener("click", () => {
          if (candidateIndex < candidates.length - 1)
            setCurrent(candidates[candidateIndex + 1].id);
        });

        document.getElementById("toolbar-copy").textContent =
          `${module.title} · ${candidateIndex + 1}/${candidates.length} · 답안은 자동 저장된다`;
      }

      function render() {
        renderModules();
        renderProgress();
        document.getElementById("status-filter").value = state.filter;
        renderQuestion();
      }

      document
        .getElementById("status-filter")
        .addEventListener("change", (event) => {
          state.filter = event.target.value;
          const candidates = filteredQuestions();
          state.currentId = candidates[0]?.id ?? state.currentId;
          saveState();
          render();
        });

      document
        .getElementById("next-open-button")
        .addEventListener("click", () => {
          const next = questions.find(
            (question) => !state.reviews[question.id],
          );
          if (next) setCurrent(next.id);
        });

      document.getElementById("reset-button").addEventListener("click", () => {
        if (!window.confirm("작성한 답안과 진도를 모두 지울까?")) return;
        state = {
          ...defaultState,
          answers: {},
          reviews: {},
          revealed: {},
          hints: {},
        };
        saveState();
        render();
      });

      document
        .getElementById("print-button")
        .addEventListener("click", () => window.print());

      document.addEventListener("keydown", (event) => {
        if (!event.altKey) return;
        const candidates = filteredQuestions();
        const index = candidates.findIndex(
          (question) => question.id === state.currentId,
        );
        if (event.key === "ArrowLeft" && index > 0)
          setCurrent(candidates[index - 1].id);
        if (event.key === "ArrowRight" && index < candidates.length - 1) {
          setCurrent(candidates[index + 1].id);
        }
      });

      render();
    </script>
  </body>
</html>
