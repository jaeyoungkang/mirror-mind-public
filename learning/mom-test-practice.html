<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맘 테스트 연습장</title>
<style>
:root { --bg:#fbfaf7; --fg:#1f1d1a; --muted:#6b665e; --line:#e7e2d8; --accent:#b0224b; --card:#ffffff; --soft:#f3f0e9; --good:#1e7a46; --bad:#b0224b; --cond:#946200; }
@media (prefers-color-scheme: dark) { :root { --bg:#16151a; --fg:#e9e6df; --muted:#9a948a; --line:#2c2a30; --accent:#ff5c86; --card:#1c1b21; --soft:#211f27; --good:#4cc98a; --bad:#ff5c86; --cond:#e0a93e; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Apple SD Gothic Neo","Noto Serif KR",serif; line-height:1.62; font-size:16.5px; }
.wrap { max-width:860px; margin:0 auto; padding:0 22px 120px; }
header.top { padding:38px 0 14px; border-bottom:2px solid var(--fg); margin-bottom:16px; }
header.top h1 { margin:0 0 4px; font-size:1.7rem; letter-spacing:-0.01em; }
header.top .sub { margin:0; color:var(--muted); font-size:0.9rem; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); padding:12px 0 10px; z-index:5; border-bottom:1px solid var(--line); }
.tab { font-family:system-ui,sans-serif; font-size:0.84rem; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:18px; padding:6px 13px; cursor:pointer; }
.tab.active { background:var(--accent); border-color:var(--accent); color:#fff; }
.tab .pct { font-size:0.72rem; opacity:0.75; margin-left:4px; }
main { padding-top:18px; }
.modehead { font-family:system-ui,sans-serif; color:var(--muted); font-size:0.84rem; margin:2px 0 14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin-bottom:14px; }
.card .qno { font-family:system-ui,sans-serif; font-size:0.75rem; color:var(--muted); margin-bottom:8px; }
.prompt { font-size:1.12rem; margin:0 0 6px; }
.prompt .who { color:var(--muted); font-size:0.85rem; font-family:system-ui,sans-serif; }
.scene { color:var(--muted); font-size:0.9rem; margin:0 0 12px; }
.opts { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
.opt { text-align:left; font:inherit; font-size:0.95rem; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:9px; padding:10px 14px; cursor:pointer; }
.opt:hover { border-color:var(--accent); }
.opt.sel-right { border-color:var(--good); background:color-mix(in srgb, var(--good) 10%, var(--bg)); }
.opt.sel-wrong { border-color:var(--bad); background:color-mix(in srgb, var(--bad) 10%, var(--bg)); }
.opt.is-right { border-color:var(--good); }
.opt:disabled { cursor:default; opacity:0.92; }
.verdict { font-family:system-ui,sans-serif; font-weight:700; font-size:0.95rem; margin:16px 0 6px; }
.verdict.good { color:var(--good); } .verdict.bad { color:var(--bad); } .verdict.cond { color:var(--cond); }
.expl { border-top:1px dashed var(--line); margin-top:14px; padding-top:4px; }
.expl p { margin:8px 0; font-size:0.94rem; }
.expl .fix { background:var(--soft); border-radius:8px; padding:10px 13px; }
.expl .fix b { font-family:system-ui,sans-serif; font-size:0.8rem; color:var(--muted); display:block; margin-bottom:3px; font-weight:600; }
.rot { font-style:italic; color:var(--muted); font-size:0.9rem; }
.src { font-family:system-ui,sans-serif; font-size:0.74rem; color:var(--muted); margin-top:10px; }
.nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-family:system-ui,sans-serif; }
.btn { font-family:system-ui,sans-serif; font-size:0.88rem; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:9px; padding:8px 18px; cursor:pointer; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn:disabled { opacity:0.4; cursor:default; }
.score { font-size:0.85rem; color:var(--muted); }
.done { text-align:center; padding:30px 10px; }
.done .big { font-size:2.2rem; font-weight:700; margin:8px 0; }
.done p { color:var(--muted); }
.done .btns { display:flex; gap:10px; justify-content:center; margin-top:14px; }
/* dialogue review */
.dlg-list details { border:1px solid var(--line); border-radius:11px; background:var(--card); margin-bottom:12px; }
.dlg-list summary { cursor:pointer; padding:14px 18px; font-family:system-ui,sans-serif; font-weight:600; font-size:0.95rem; list-style:none; }
.dlg-list summary::-webkit-details-marker { display:none; }
.dlg-list summary .tag { font-size:0.72rem; font-weight:600; border-radius:12px; padding:1px 9px; margin-left:8px; vertical-align:1px; }
.tag.t-bad { color:var(--bad); border:1px solid var(--bad); }
.tag.t-good { color:var(--good); border:1px solid var(--good); }
.tag.t-cond { color:var(--cond); border:1px solid var(--cond); }
.dlg-body { padding:2px 18px 16px; }
.dlg-note { color:var(--muted); font-size:0.88rem; margin:4px 0 12px; }
.dlg-ctl { font-family:system-ui,sans-serif; font-size:0.78rem; margin-bottom:10px; }
.dlg-ctl button { font:inherit; border:none; background:none; color:var(--accent); cursor:pointer; padding:0 8px 0 0; }
.line { padding:9px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.line:last-child { border-bottom:none; }
.line .who { font-family:system-ui,sans-serif; font-size:0.76rem; color:var(--muted); font-weight:600; }
.line .txt { margin:1px 0 0; }
.line .ann { display:none; margin:7px 0 2px; font-size:0.87rem; color:var(--muted); background:var(--soft); border-left:3px solid var(--accent); padding:7px 11px; border-radius:0 7px 7px 0; }
.line.open .ann { display:block; }
.line .hint { font-family:system-ui,sans-serif; font-size:0.7rem; color:var(--muted); opacity:0.6; }
.wrapup { margin-top:14px; font-size:0.92rem; background:var(--soft); border-radius:9px; padding:12px 15px; }
/* reference */
.ref h2 { font-size:1.15rem; margin:26px 0 8px; border-bottom:1px solid var(--line); padding-bottom:6px; }
.ref h3 { font-size:0.98rem; margin:16px 0 6px; }
.ref ul, .ref ol { margin:6px 0 12px; padding-left:22px; }
.ref li { margin:4px 0; font-size:0.95rem; }
.ref .note { color:var(--muted); font-size:0.88rem; }
.ref .rots li { font-style:italic; color:var(--muted); }
kbd.k { font-family:system-ui,sans-serif; font-size:0.78rem; background:var(--soft); border:1px solid var(--line); border-radius:5px; padding:0 6px; }
@media (max-width:600px){ .card { padding:16px; } body { font-size:15.5px; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>맘 테스트 연습장</h1>
  <p class="sub">『The Mom Test』(롭 피츠패트릭)의 규칙과 예시로만 구성했다 · 대화는 한국어 어법에 맞게 의역</p>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<footer style="margin-top:48px; padding-top:14px; border-top:1px solid var(--line); font-family:system-ui,sans-serif; font-size:0.78rem; color:var(--muted); line-height:1.7">
  원작: Rob Fitzpatrick, <i>The Mom Test</i> (<a href="https://www.momtestbook.com" style="color:inherit">momtestbook.com</a>).
  이 페이지는 개인 학습용 연습 도구로, 책의 규칙과 예시를 한국어 대화에 맞게 발췌·의역했다.
  전체 내용과 맥락은 원서로 읽는 것을 권한다.
</footer>
</div>

<script>
"use strict";
/* ── 데이터: 모든 항목은 책의 해당 절에서 그대로 가져왔고, 대화체만 한국어에 맞게 의역했다 ── */

var Q_ITEMS = [
 { id:"q1", q:"“이 아이디어 어떤 것 같아요? 괜찮을까요?”", v:"bad",
   why:"끔찍한 질문이다. 아이디어가 좋은지는 오직 시장만이 말해줄 수 있다. 나머지는 전부 의견일 뿐이고, 거짓 긍정이 나올 위험이 크다.",
   fix:"지금 그 일을 어떻게 하고 있는지 보여달라고 한다. 어떤 부분이 좋고 싫은지, 지금 방식에 정착하기 전에 뭘 시도해봤는지, 어디서 돈이 새는지, 예산은 있는지 묻는다. 그 정보를 갖고 좋은 아이디어인지는 스스로 판단한다.",
   rot:"의견은 아무 가치가 없다.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q2", q:"“이런 걸 해주는 제품이 나오면 사시겠어요?”", v:"bad",
   why:"당신을 기쁘게 해주고 싶은, 지나치게 낙관적인 사람들에게 의견과 가정을 묻는 셈이다. 답은 거의 항상 “네”라서 아무 쓸모가 없다.",
   fix:"지금 그 문제를 어떻게 해결하는지, 비용과 시간이 얼마나 드는지 묻는다. 마지막으로 그 문제가 불거졌을 때 얘기를 들어본다. 해결 안 했다면 왜 안 했는지 — 검색이라도 해봤는지 묻는다.",
   rot:"미래와 얽힌 것은 무엇이든 지나치게 낙관적인 거짓말이다.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q3", q:"“이런 게 있다면 얼마까지 내시겠어요?”", v:"bad",
   why:"앞의 질문과 똑같이 나쁜데, 숫자가 붙으면 뭔가 엄밀하고 진실처럼 느껴져서 더 잘 속인다.",
   fix:"이미 살아가고 있는 삶을 묻는다. 그 문제가 물리는 비용은 얼마인가? 지금 해결에 얼마를 내고 있나? 잡아둔 예산은 얼마인가?",
   rot:"사람들은 당신이 듣고 싶어 하는 말이라고 여기면 거짓말을 한다.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q4", q:"“이상적인 제품이라면 뭘 해줄까요?”", v:"cond",
   why:"좋은 후속 질문을 던질 때만 그럭저럭 괜찮다. 배구의 스파이크 직전 ‘세트’와 같아서, 그 자체로는 큰 도움이 안 된다. 기능 요청을 수집하려는 게 아니다 — 그 요청 뒤의 동기와 제약이 결정적이다.",
   fix:"답이 나오면 반드시 “왜 그게 필요한데요?”로 파고든다.",
   rot:"사람들은 자기 문제가 무엇인지는 알지만, 그 문제를 어떻게 풀어야 하는지는 모른다.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q5", q:"“그걸 왜 굳이 그렇게 하세요?”", v:"good",
   why:"드러난 문제에서 진짜 문제로 넘어가는 데 탁월하다. 매일 스프레드시트를 이메일로 보내던 금융 담당자들이 메시징 도구를 요청했지만, 이 질문은 “모두 최신 버전으로 작업하고 있음을 확실히 하려고”라는 답으로 이어졌고, 해법은 드롭박스에 가까운 것이 되었다. 동기, 즉 ‘왜’를 알려준다.",
   fix:null, rot:"그들의 목표를 이해하기 전까지는 눈을 감고 쏘는 셈이다.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q6", q:"“그것 때문에 실제로 어떤 일까지 생기는데요?”", v:"good",
   why:"‘돈을 내서라도 해결하고 싶은’ 문제와 ‘성가시긴 해도 감당할 만한’ 문제를 갈라준다. 어떤 문제는 크고 값비싼 여파를 낳고, 어떤 문제는 존재해도 중요하지 않다. 가격 신호도 준다. “재앙”이라 소리치던 사람이 이 질문에는 “인턴 몇 명 붙였더니 잘 굴러가요”라고 답한 사례가 있다.",
   fix:null, rot:"어떤 문제는 사실 별로 중요하지 않다.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q7", q:"“마지막으로 그런 일이 있었을 때, 그때 상황을 처음부터 얘기해주실래요?”", v:"good",
   why:"가능하면 설명을 듣지 말고 직접 보여주게 만들어야 한다. 의견이 아니라 행동으로 배운다. 실제 작업을 지켜보면 두루뭉술하게 얼버무릴 수 없다. 현장에 못 들어간다면 마지막 사례를 처음부터 짚어달라는 것만으로도 큰 도움이 된다.",
   fix:null, rot:"작업하는 모습을 지켜보면, 고객이 문제라고 생각하는 곳이 아니라 문제와 비효율이 실제로 어디에 있는지가 드러난다.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q8", q:"“그동안 그 문제 해결하려고 어떤 걸 해보셨어요?”", v:"good",
   why:"지금 무엇을 쓰는지, 비용은 얼마인지, 무엇이 좋고 싫은지 알 수 있다. “무조건 돈 낼게요”라던 사람에게 이 질문을 하자, 검색조차 해본 적이 없음이 드러났다. 추상적으로는 ‘무조건’이었지만 구체적으로는 관심조차 없었다.",
   fix:null, rot:"이미 해결 방법을 찾아본 적이 없다면, 당신 것도 찾지 않을 것이다(사지도 않을 것이다).", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q9", q:"“이런 걸 해주는 제품이 월 5만 원이면 쓰시겠어요?”", v:"bad",
   why:"숫자를 붙였다고 나아지지 않는다. 사람들은 미래의 자신을 낙관하고, 당신을 기쁘게 해주고 싶어 한다. 게다가 상대의 삶이 아니라 내 아이디어에 관한 질문이다.",
   fix:"미래에 할 것 같은 일이 아니라 지금 이미 하는 일을 묻는다. 충분히 진척된 단계라면 말 그대로 돈을 요구한다 — 예치금이나 선주문을 손에 쥐면 진실을 알 수 있다.",
   rot:"사람들은 돈을 요구받으면 거짓말을 멈춘다.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q10", q:"“지금은 그 문제를 어떻게 처리하고 계세요?”", v:"good",
   why:"업무 흐름 정보에 더해 가격 기준점을 준다. 임시방편에 매달 10만 원을 쓰는지, 대체하려는 것에 연간 1억을 쓰는지에 따라 내가 노는 판이 달라진다.",
   fix:null, rot:"얼마를 낼지 정확히 말해주는 일은 드물지만, 그들에게 그게 얼마의 가치인지는 종종 보여준다.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q11", q:"“그 비용은 어느 예산에서 나가나요?”", v:"good",
   why:"B2B에서는 반드시 던져야 하는 질문이다. 구매가 누구 예산에서 나오는지, 회사 안에서 누가 거래를 무산시킬 힘을 쥐고 있는지에 관한 대화로 이어진다. 구매 과정에 관한 이 지식은 반복 가능한 영업 로드맵이 된다.",
   fix:null, rot:null, src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q12", q:"“제가 또 누구랑 이야기해보면 좋을까요?”", v:"good",
   why:"모든 대화를 이렇게 끝맺어라. 흥미로운 걸 잡았고 사람들을 잘 대하고 있다면 소개로 만날 사람이 금세 불어난다. 소개를 꺼린다면 그것도 정보다 — 만남을 망치고 있거나, 상대가 이 문제에 관심이 없다는 뜻이다.",
   fix:null, rot:null, src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q13", q:"“제가 물어봤어야 하는데 놓친 게 있을까요?”", v:"good",
   why:"만남이 끝날 즈음이면 상대는 내가 뭘 하려는지 안다. 나는 업계를 모르니, 가장 중요한 핵심을 놓친 채일 수 있다. 이 질문은 상대가 내 질문 방향을 정중하게 바로잡을 기회를 준다. 실력이 늘면 자연히 버리게 되는 목발 같은 질문이다.",
   fix:null, rot:"사람들은 당신을 돕고 싶어 한다. 그럴 구실을 만들어 줘라.", src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q14", q:"“평소 일하시는 흐름을 처음부터 짚어가며 얘기해주실래요?”", v:"good",
   why:"전체 작업 흐름을 안내받으면 여러 질문이 단번에 풀린다. 하루를 어떻게 보내는지, 어떤 도구를 쓰는지, 누구와 이야기하는지, 어떤 제약이 있는지, 내 제품이 그 하루에 어떻게 들어맞고 무엇과 연동돼야 하는지.",
   fix:null, rot:null, src:"1장 · 좋은 질문 / 나쁜 질문" },
 { id:"q15", q:"“혹시 ~하실 때도 있나요?” (예: “운동 앱 쓰실 때도 있어요?”)", v:"cond",

    {w:"엄마", t:"그거야 크리스마스 때 그냥 받게 되는 거지. 펴보지도 않았어. 이 나이에 라자냐 레시피가 하나 더 필요한 것도 아니고!", a:"금덩이다: ① 나이 든 사람에겐 뻔한 레시피가 더 필요 없다 ② 선물 시장이 탄탄할 수 있다 ③ 기본을 모르는 젊은 요리사가 더 나은 세그먼트일 수 있다."},
    {w:"아들", t:"그럼 마지막으로 직접 산 요리책은 뭐예요?", a:"“난 요리책 안 사” 같은 일반론에는 구체적인 사례를 물어 파고든다."},
    {w:"엄마", t:"그러고 보니 석 달 전에 비건 요리책을 샀네. 네 아빠가 건강하게 먹어보겠다고 해서.", a:"또 하나의 금맥: 경험 많은 요리사도 특화·틈새 요리책은 산다."}
   ],
   wrap:"엄마가 거짓말을 할 수 없었던 건 아이디어 얘기를 아예 꺼내지 않았기 때문이다. 아이디어를 꺼내지 않기만 해도 저절로 더 나은 질문을 하게 된다 — 이것이 가장 쉽고 가장 큰 개선이다." },
 { id:"d3", title:"칭찬을 곧이곧대로 — 나쁜 대화", tag:"bad", src:"2장",
   note:"피치 후 칭찬을 액면 그대로 받아들이면 어떻게 되는지.",
   lines:[
    {w:"나", t:"…뭐 그런 겁니다. 말하자면 이 업계를 위한 배민 같은 건데, 자동화 덕분에 더 낫죠.", a:"빵! 피치 완벽하게 꽂았다. (착각)"},
    {w:"상대", t:"멋지네요. 마음에 들어요.", a:"이게 나랑 무슨 상관이지? (빈말 칭찬)"},
    {w:"나", t:"일하시는 방식이 완전히 바뀔 겁니다. 비용도 35% 절감될 걸로 예측하고 있어요.", a:"난 정말 대단해."},
    {w:"상대", t:"훌륭하네요. 진행되면 계속 알려주세요.", a:"내가 또 이런 스타트업 피치에 맞장구를 치고 있다니. (칭찬 + 미루기 전술)"},
    {w:"나", t:"좋습니다, 감사해요!", a:"난 딱 스티브 잡스 같아. 그보다 더 잘생긴 것만 빼면."},
    {w:"나 (사무실)", t:"그 미팅 정말 잘 풀렸어. 다들 좋아해. 드디어 사람들이 원하는 걸 찾은 것 같아.", a:"“미팅 잘 풀렸어” “다들 좋아해”는 전부 경고 신호다. 왜 좋아했는지, 얼마를 아껴주는지, 뭘 시도해봤는지 답할 수 없다면 데이터가 아니라 칭찬을 쥔 것이다."},
    {w:"팀 (6개월 뒤)", t:"왜 고객이 한 명도 없는 거야? 다들 좋아한다며?", a:""},
    {w:"나", t:"모르겠어, 천 명쯤 만났는데. 구매 기준을 하나 놓쳤나 봐. 더 얘기해보면 다음엔 될 거야.", a:"완전히 망했다."}
   ],
   wrap:"빈말 칭찬은 고객 학습의 ‘바보의 금’이다 — 반짝이고, 정신을 흩뜨리고, 아무 가치가 없다." },
 { id:"d4", title:"칭찬 흘려보내기 — 좋은 대화", tag:"good", src:"2장",
   note:"실수로 피치에 빠졌지만 수습하고, 칭찬 뒤의 사실을 캔다.",
   lines:[
    {w:"나", t:"…그런 거예요. 말하자면 이 업계를 위한 배민 같은 거죠.", a:"이런, 방금 피치 모드에 빠져버렸다. 수습하고 뭔가 알아내 보자."},
    {w:"상대", t:"진짜 멋지네요. 마음에 들어요.", a:"이게 나랑 무슨 상관이지? (빈말 칭찬)"},
    {w:"나", t:"앗, 죄송해요 — 흥분해서 제 설명만 늘어놨네요. 이 분야에서 잘하고 계신 것 같은데, 요즘 이런 일은 어떻게 처리하고 계세요?", a:"저 칭찬 때문에 의심이 들었다. 흘려보내고, 잠재 고객인지 그냥 나를 떼어내려는 건지 알아내 보자."},
    {w:"상대", t:"네? 아, 뭐, 그럼요. 손발 맞추려고 그 과정을 관리하는 사람이 두어 명 있고요, 엑셀이랑 이메일을 잔뜩 써서 굴려요. 아무튼 아이디어 정말 좋네요. 분명 잘될 거예요.", a:"사실을 원한다면 여기 있다. 다만 마지막에 슬쩍 끼워 넣은 칭찬을 눈여겨보라 — 사고 싶다는 뜻은 전혀 아니다."},
    {w:"나", t:"그런 식으로 푸시는 건 처음 들어봐요, 흥미롭네요. 실제로 어떻게 다 맞물려 돌아가는지 하나씩 설명해주실 수 있어요?", a:"칭찬은 무시하고 사실에 집중한다. 정규직 두 명이라니 — 이게 이 정도 값어치가 있을 줄은 짐작도 못 했다."},
    {w:"상대", t:"(더 자세한 업무 흐름 설명)", a:""},
    {w:"나", t:"그렇게 하시면서 어떤 어려움들이 생기던가요?", a:"세상에서 제일 좋은 질문은 아니지만, 비효율과 걸림돌의 실마리를 찾는 중이다. 하나 찾으면 후속 질문으로 파고든다."}
   ],
   wrap:"좋은 대화가 꼭 듣고 싶던 말로 끝날 필요는 없다. 진실에 다다르면 된다." },
 { id:"d5", title:"좋은 (부정적) 대화", tag:"good", src:"2장",
   note:"부정적인 결과지만 진실에 다다른, 만족해도 좋은 대화.",
   lines:[
    {w:"상대", t:"정말 멋지네요. 마음에 쏙 들어요.", a:"빈말 칭찬이다."},
    {w:"나", t:"지금은 이런 걸 어떻게 처리하고 계세요?", a:"칭찬을 흘려보내고 진짜 사실로 파고든다."},
    {w:"상대", t:"아, 사실 그렇게 큰일은 아니에요. 그냥 대충 무시하고 넘어가는 편이죠.", a:"문제가 별 여파를 남기지 않는다는 뜻 — 이 사람은 해결책을 살 시장에 있지 않다."}
   ],
   wrap:"거짓 칭찬을 꿰뚫어 보고 신기루 뒤의 사실을 찾아냈다. 분위기가 우호적이면 과정을 설명해달라고 청해, 업계 전체의 비문제인지 이 사람만의 특수함인지 가려본다." },
 { id:"d6", title:"뜬구름 질문에서 구체적 질문으로 넘어가기", tag:"good", src:"2장",
   note:"겉치레 질문 자체는 죄가 아니다 — 그 답을 믿는 게 실수다. 발판으로 쓰는 법.",
   lines:[
    {w:"나", t:"혹시 이런 일 하실 때도 있어요?", a:"겉치레 대답을 부르는 질문이다."},
    {w:"상대", t:"아 그럼요, 늘 그래요.", a:"그 자체로는 아무 가치도 없지만, 여기서부터 닻을 내릴 수 있는 겉치레 대답이다."},
    {w:"나", t:"가장 최근에 그런 일이 있었던 게 언제였어요?", a:"맘 테스트를 써서 과거의 구체적인 사례를 묻는다."},
    {w:"상대", t:"지지난 주말이요.", a:"겉치레를 성공적으로 닻 내렸다. 이제 일반론과 가정 대신 진짜 사실을 얻을 준비가 됐다."},
    {w:"나", t:"그때 얘기를 좀 자세히 들려주실 수 있어요?", a:"다시 좋은 질문으로 돌아온다."}
   ], wrap:null },
 { id:"d7", title:"‘받은편지함 0’ — 일반론을 붙잡아 구체화하기", tag:"good", src:"2장",
   note:"받은편지함 관리 도구를 설계 중이라고 하자.",
   lines:[
    {w:"상대", t:"저는 ‘받은편지함 0’ 신봉자예요. 그게 제 삶을 완전히 바꿔놨죠.", a:"일반론적인(즉 뜬구름 같은) 주장이다."},
    {w:"나", t:"하하, 대단하네요. 저는 ‘받은편지함 0’ 실패자거든요. 지금 받은편지함엔 몇 개나 있어요?", a:"이 뜬구름이 정말인지 구체적으로 파고들어 보자."},
    {w:"상대", t:"오늘 아침 이후로 온 게 열 개쯤 되네요.", a:"사실이다!"},
    {w:"나", t:"와, 진짜 관리 잘하시네요. 저는 지금 200개쯤 쌓여 있어요. 마지막으로 완전히 무너졌던 건 언제예요?", a:"여전히 잘 관리한다고 주장하고 있으니, 그렇지 못했던 구체적인 사례를 찾아본다."},
    {w:"상대", t:"아… 3주 전이요. 출장 갔는데 호텔 인터넷이 완전히 먹통이어서, 복구하는 데 열흘쯤 걸렸어요.", a:""},
    {w:"나", t:"그때 어떻게 수습하셨는지 처음부터 얘기해주실 수 있어요?", a:"성공적으로 구체화됐다 — 이제 ‘보통’이 아니라 실제로 무슨 일이 있었는지를 이야기하고 있다."}
   ],
   wrap:"“내 받은편지함은 늘 통제되고 있다”는 주장에 중요한 단서가 붙었다: “통제가 안 될 때만 빼고 — 그럴 땐 복구가 완전히 악몽이다.” 일반론을 말할 때 사람들은 되고 싶은 모습으로 자신을 묘사한다. 예외 상황은 구체적으로 파야 나온다." },
 { id:"d8", title:"적립 카드 불평 — 나쁜 대화 (피치 + 뜬구름 수용)", tag:"bad", src:"2장",
   note:"매장용 모바일 적립 앱을 만드는 중. 앞에 줄 선 사람이 불평하는 걸 들었다.",
   lines:[
    {w:"상대", t:"대체 어떤 멍청이가 카페 적립 카드를 천 장씩 들고 다니게 만든 거야?", a:""},
    {w:"나", t:"어! 안녕하세요! 마침 제가 종이 카드 없이 단골 할인을 받게 해주는 모바일 앱을 만들고 있거든요. 이런 거 나오면 쓰실 것 같으세요?", a:"찾을 수 있는 최악에 가까운 질문이다. 자아를 드러냈고 ‘쓰실 것 같으세요’류 질문을 던졌다. 거짓 긍정을 구걸하는 셈이다."},
    {w:"상대", t:"당연하죠, 진작 나왔어야죠! 저라면 무조건 쓸 거예요.", a:"겉치레에, 가정이고, 미래의 약속이다."}
   ],
   wrap:"피치 모드로 갈아탄 탓에 멀쩡히 좋은 학습 기회를 날리고 겉치레 말만 한 움큼 얻었다." },
 { id:"d9", title:"적립 카드 불평 — 좋은 대화 (과거 행동에 닻 내리기)", tag:"good", src:"2장",
   note:"같은 상황, 다른 진행.",
   lines:[
    {w:"상대", t:"대체 어떤 멍청이가 카페 적립 카드를 천 장씩 들고 다니게 만든 거야?", a:""},
    {w:"나", t:"어이없죠? 제 지갑도 두께가 거의 한 뼘이에요. 근데 혹시, 폰에 까는 적립 앱 같은 거 써본 적 있으세요?", a:"과거 행동에 닻을 내린다."},
    {w:"상대", t:"그런 게 있어요?", a:"어쩌면 내 분노가 엉뚱한 데로 향한 건지도."},
    {w:"나", t:"네, 학교 카페에 안내 표지판 있던데, 보신 적 있을 거예요.", a:""},
    {w:"상대", t:"아 맞다, 기억나요. 근데 저는 늘 좀 급해서요.", a:"광고하려는 순간의 심리 상태와 상황에 관한 꽤 괜찮은 고객 인사이트다."},
    {w:"나", t:"지금 한번 받아보시는 건 어때요?", a:"확답 없이 미적지근하게 굴면 결정을 내리게 만든다. 오늘 안 풀 문제면 내일 내 해법에도 관심 없다."},
    {w:"상대", t:"다음엔 꼭 할게요.", a:"진짜 문제가 아니다."}
   ],
   wrap:"이 사람은 고객이 아니라 불평꾼이다. 다만 같은 질문에 “몇 개 받아봤는데 체인마다 달라서 싫었어요”(적극 탐색자), “10% 할인뿐이라 데이터 수집용 같았어요”(혜택 문제), “그 앱 써봤어요? 형편없어요”(실행 문제) 같은 답이 돌아왔다면 각각 쓸모 있는 신호다. 고객이 아니라는 사실 자체도 쓸모 있다." },
 { id:"d10", title:"성급한 줌인 — (정말, 정말) 나쁜 대화", tag:"bad", src:"3장",
   note:"운동 앱을 만드는 중. 위험한 이유: 주의 깊게 보지 않으면 잘 흘러간 것처럼 보인다.",
   lines:[
    {w:"나", t:"안녕하세요, 시간 내주셔서 감사해요. 저희는 사람들이 몸매를 유지하도록 돕는 앱을 만들고 있는데, 평소 건강 관리를 어떻게 하시는지 궁금해서요.", a:"끔찍한 오프닝은 아니지만, 아이디어 언급은 꼭 필요한 경우가 아니면 피하는 게 좋다 — 상대를 편향시킨다."},
    {w:"상대", t:"네.", a:"난 운동이라곤 전혀 안 하니까, 금방 끝나겠네."},
    {w:"나", t:"운동은 얼마나 자주 하세요?", a:"인구통계형 질문 — 새 통찰은 없지만 어떤 사람인지 파악해 후속 질문을 고르는 데는 쓸모 있다."},
    {w:"상대", t:"사실상 안 해요.", a:"음, 그럼 여기서 끝난 것 같은데!"},
    {w:"나", t:"운동하러 가는 데 가장 큰 문제가 뭐라고 생각하세요?", a:"바로 여기서 대화가 완전히 엉망이 된다. 몸매 관리가 진짜 문제인지 알아내는 대신 성급하게 파고들었다. 여기서 얻는 어떤 답이든 위험할 만큼 오도한다."},

 { key:"ref",  label:"원칙" },
 { key:"q",    label:"질문 판별", items: Q_ITEMS },
 { key:"resp", label:"대답 대응", items: R_ITEMS },
 { key:"meet", label:"미팅 판정", items: M_ITEMS },
 { key:"next", label:"다음 한마디", items: N_ITEMS },
 { key:"dlg",  label:"대화 복기" }
];
var V_LABEL = { good:"좋은 질문", bad:"나쁜 질문", cond:"조건부 — 후속과 해석에 달렸다" };
var V_OPTS = ["good","bad","cond"];

var view = document.getElementById("view");
var tabsEl = document.getElementById("tabs");
var current = "q";
var session = null; /* {mode, order, idx, score, wrong[], answered} */

function modeAcc(items){
  var n = 0, ok = 0;
  items.forEach(function(it){ var s = stats[it.id]; if (s){ n += s.n; ok += s.ok; } });
  return n ? Math.round(ok / n * 100) + "%" : null;
}
function renderTabs(){
  tabsEl.innerHTML = "";
  MODES.forEach(function(m){
    var b = document.createElement("button");
    b.className = "tab" + (m.key === current ? " active" : "");
    var acc = m.items ? modeAcc(m.items) : null;
    b.innerHTML = esc(m.label) + (acc ? '<span class="pct">' + acc + '</span>' : "");
    b.onclick = function(){ current = m.key; session = null; render(); };
    tabsEl.appendChild(b);
  });
}

function startSession(modeKey, itemsOverride){
  var m = MODES.filter(function(x){ return x.key === modeKey; })[0];
  var items = itemsOverride || m.items;
  session = { mode:modeKey, order: shuffle(items), idx:0, score:0, wrong:[], answered:false };
}

function quizSpec(modeKey, item){
  if (modeKey === "q") return {
    head:"이 질문은 맘 테스트를 통과하는가?",
    prompt:item.q, scene:null,
    opts:V_OPTS.map(function(v){ return V_LABEL[v]; }),
    correct:V_OPTS.indexOf(item.v), vClass:item.v, vText:V_LABEL[item.v]
  };
  if (modeKey === "resp") return {
    head:"상대의 이 말은 어떤 데이터인가?",
    prompt:item.u, scene:null,
    opts:R_CATS, correct:item.cat,
    vClass:(item.cat === 3 ? "good" : "bad"),
    vText:R_CATS[item.cat] + " → " + R_MOVES[item.cat]
  };
  if (modeKey === "meet") return {
    head:"미팅이 이 말로 끝났다. 성공인가 실패인가?",
    prompt:item.u, scene:null,
    opts:M_OPTS, correct:M_MAP[item.v], vClass:item.v, vText:M_OPTS[M_MAP[item.v]]
  };
  if (modeKey === "next") return {
    head:"다음 한마디로 무엇을 고르겠는가?",
    prompt:item.u || "—", scene:item.scene,
    opts:item.opts, correct:item.correct, vClass:"good", vText:"책의 진행: " + item.opts[item.correct]
  };
}

function renderQuiz(){
  var m = MODES.filter(function(x){ return x.key === session.mode; })[0];
  if (session.idx >= session.order.length){ renderDone(m); return; }
  var item = session.order[session.idx];
  var spec = quizSpec(session.mode, item);
  var card = document.createElement("div"); card.className = "card";
  var h = '<div class="qno">' + (session.idx + 1) + ' / ' + session.order.length + ' · ' + esc(spec.head) + '</div>';
  if (spec.scene) h += '<p class="scene">' + esc(spec.scene) + '</p>';
  if (spec.prompt && spec.prompt !== "—") h += '<p class="prompt">' + esc(spec.prompt) + '</p>';
  card.innerHTML = h;
  var opts = document.createElement("div"); opts.className = "opts";
  spec.opts.forEach(function(label, i){
    var b = document.createElement("button"); b.className = "opt"; b.textContent = label;
    b.onclick = function(){ answer(i, spec, item, opts, card); };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  view.innerHTML = "";
  var head = document.createElement("p"); head.className = "modehead";
  head.textContent = m.label + " — 책의 판정과 근거가 정답 기준이다.";
  view.appendChild(head);
  view.appendChild(card);
  var navr = document.createElement("div"); navr.className = "nav-row";
  navr.innerHTML = '<span class="score">맞춘 것 ' + session.score + ' / ' + session.idx + '</span>';
  var next = document.createElement("button"); next.className = "btn primary"; next.textContent = "다음";
  next.disabled = true; next.id = "nextBtn";
  next.onclick = function(){ session.idx++; session.answered = false; renderQuiz(); renderTabs(); };
  navr.appendChild(next);
  view.appendChild(navr);
}

function answer(i, spec, item, optsEl, card){
  if (session.answered) return;
  session.answered = true;
  var ok = (i === spec.correct);
  if (ok) session.score++; else session.wrong.push(item);
  record(item.id, ok);
  var btns = optsEl.querySelectorAll(".opt");
  btns.forEach(function(b, j){
    b.disabled = true;
    if (j === i) b.className = "opt " + (ok ? "sel-right" : "sel-wrong");
    else if (j === spec.correct) b.className = "opt is-right";
  });
  var ex = document.createElement("div"); ex.className = "expl";
  var vh = '<div class="verdict ' + spec.vClass + '">' + (ok ? "맞았다 — " : "책의 판정: ") + esc(spec.vText) + '</div>';
  var body = '<p>' + esc(item.why) + '</p>';
  if (item.fix) body += '<p class="fix"><b>바로잡기 / 다음 수</b>' + esc(item.fix) + '</p>';
  if (item.move) body += '<p class="fix"><b>다음 수</b>' + esc(item.move) + '</p>';
  if (item.rot) body += '<p class="rot">경험칙: ' + esc(item.rot) + '</p>';
  body += '<div class="src">출처: The Mom Test · ' + esc(item.src) + '</div>';
  ex.innerHTML = vh + body;
  card.appendChild(ex);
  var scoreEl = view.querySelector(".score");
  if (scoreEl) scoreEl.textContent = "맞춘 것 " + session.score + " / " + (session.idx + 1);
  document.getElementById("nextBtn").disabled = false;
}

function renderDone(m){
  var total = session.order.length;
  var d = document.createElement("div"); d.className = "card done";
  d.innerHTML = '<p>' + esc(m.label) + ' 한 바퀴 완료</p><div class="big">' + session.score + ' / ' + total + '</div>' +
    '<p>' + (session.wrong.length ? "틀린 항목 " + session.wrong.length + "개는 다시 풀어볼 수 있다." : "전부 맞았다.") + '</p>';
  var btns = document.createElement("div"); btns.className = "btns";
  if (session.wrong.length){
    var retry = document.createElement("button"); retry.className = "btn primary"; retry.textContent = "틀린 것만 다시";
    var wrongItems = session.wrong.slice();
    retry.onclick = function(){ startSession(m.key, wrongItems); renderQuiz(); };
    btns.appendChild(retry);
  }
  var again = document.createElement("button"); again.className = "btn"; again.textContent = "처음부터 다시";
  again.onclick = function(){ startSession(m.key); renderQuiz(); };
  btns.appendChild(again);
  d.appendChild(btns);
  view.innerHTML = ""; view.appendChild(d);
}

function renderDialogues(){
  view.innerHTML = '<p class="modehead">대화 복기 — 각 줄을 누르면 책의 속마음·해설이 열린다. 해설을 보기 전에 스스로 판정해보는 것이 연습이다.</p>';
  var list = document.createElement("div"); list.className = "dlg-list";
  DIALOGUES.forEach(function(d){
    var det = document.createElement("details");
    var tagCls = d.tag === "good" ? "t-good" : d.tag === "bad" ? "t-bad" : "t-cond";
    var tagTxt = d.tag === "good" ? "좋은 대화" : d.tag === "bad" ? "나쁜 대화" : "애매한 대화";
    det.innerHTML = '<summary>' + esc(d.title) + '<span class="tag ' + tagCls + '">' + tagTxt + '</span></summary>';
    var body = document.createElement("div"); body.className = "dlg-body";
    if (d.note) body.innerHTML += '<p class="dlg-note">' + esc(d.note) + ' <span style="opacity:0.7">(출처: ' + esc(d.src) + ')</span></p>';
    var ctl = document.createElement("div"); ctl.className = "dlg-ctl";
    var openAll = document.createElement("button"); openAll.textContent = "해설 모두 열기";
    var closeAll = document.createElement("button"); closeAll.textContent = "모두 닫기";
    ctl.appendChild(openAll); ctl.appendChild(closeAll);
    body.appendChild(ctl);
    var lineEls = [];
    d.lines.forEach(function(L){
      var el = document.createElement("div"); el.className = "line";
      el.innerHTML = '<span class="who">' + esc(L.w) + '</span> <span class="hint">' + (L.a ? "· 해설" : "") + '</span>' +
        '<p class="txt">' + esc(L.t) + '</p>' + (L.a ? '<div class="ann">' + esc(L.a) + '</div>' : "");
      if (L.a) el.onclick = function(){ el.classList.toggle("open"); };
      lineEls.push(el);
      body.appendChild(el);
    });
    openAll.onclick = function(e){ e.stopPropagation(); lineEls.forEach(function(el){ el.classList.add("open"); }); };
    closeAll.onclick = function(e){ e.stopPropagation(); lineEls.forEach(function(el){ el.classList.remove("open"); }); };
    if (d.wrap) { var w = document.createElement("div"); w.className = "wrapup"; w.textContent = d.wrap; body.appendChild(w); }
    det.appendChild(body);
    list.appendChild(det);
  });
  view.appendChild(list);
}

function renderRef(){
  view.innerHTML = '<p class="modehead">책이 명시한 규칙·목록만 모았다. 연습 중 헷갈리면 여기로 돌아온다.</p><div class="ref">' + REF_HTML + '</div>';
}

function render(){
  renderTabs();
  if (current === "ref") { renderRef(); return; }
  if (current === "dlg") { renderDialogues(); return; }
  if (!session || session.mode !== current) startSession(current);
  renderQuiz();
}
render();
</script>
</body>
</html>
